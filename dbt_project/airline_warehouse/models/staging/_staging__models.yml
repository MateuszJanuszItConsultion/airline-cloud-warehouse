version: 2

models:
  - name: stg_flights
    description: "Cleaned flight records from the BTS source, one row per flight."

    # TODO: re-add uniqueness test once flight_number column is added to stg_flights
    # BTS data has multiple flights/day per carrier+route pair, current combination
    # of columns is not a valid business key
    
    columns:
      - name: flight_date
        description: "The date the flight took place"
        tests:
          - not_null

      - name: carrier_code
        description: "IATA carrier code"
        tests:
          - not_null

      - name: origin_airport
        description: "Origin airport code"
        tests:
          - not_null

      - name: dest_airport
        description: "Destination airport code"
        tests:
          - not_null