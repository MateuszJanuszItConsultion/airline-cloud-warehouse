version: 2

models:
  - name: stg_flights
    description: "Cleaned flight records from the BTS source, one row per flight."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - flight_date
              - carrier_code
              - flight_number
              - origin_airport
              - dest_airport

      - no_missing_business_keys:
          arguments:
            compare_model: "{{ source('bronze', 'flights_raw') }}"
            target_key_columns: ['flight_date', 'carrier_code', 'flight_number', 'origin_airport', 'dest_airport']
            source_key_columns: ['fl_date', 'op_carrier', 'op_carrier_fl_num', 'origin', 'dest']
    
    columns:
      - name: flight_date
        description: "The date the flight took place"
        tests:
          - not_null

      - name: carrier_code
        description: "IATA carrier code"
        tests:
          - not_null

      - name: origin_airport
        description: "Origin airport code"
        tests:
          - not_null

      - name: dest_airport
        description: "Destination airport code"
        tests:
          - not_null

  - name: stg_weather
    description: "Cleaned daily weather observations per airport."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - observation_date
              - airport_code

      - no_missing_business_keys:
          arguments:
            compare_model: "{{ source('bronze', 'weather_raw') }}"
            target_key_columns: ['observation_date', 'airport_code']
            source_key_columns: ['obs_date', 'airport_code']


    columns:
      - name: observation_date
        description: "Date of the weather observation"
        tests:
          - not_null

      - name: airport_code
        description: "IATA airport code where the observation was recorded"
        tests:
          - not_null

  - name: stg_aircraft_utilization
    description: "Cleaned daily aircraft utilization metrics."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - flight_date
              - aircraft_key
              - airport_code

      - no_missing_business_keys:
          arguments:
            compare_model: "{{ source('bronze', 'aircraft_utilization_raw') }}"
            target_key_columns: ['flight_date', 'aircraft_key', 'airport_code']
            source_key_columns: ['fl_date', 'aircraft_key', 'airport_code']
    
    columns:
      - name: flight_date
        description: "The date of the aircraft utilization record"
        tests:
          - not_null

      - name: aircraft_key
        description: "Unique identifier for the aircraft"
        tests:
          - not_null

  - name: stg_flight_events
    description: "Deduplicated flight lifecycle events (scheduled, boarding, departed, landed, arrived), ingested via Databricks Auto Loader. Multiple events per flight are expected and preserved — deduplication is only against accidental re-processing of the same event_id."
    columns:
      - name: event_id
        description: "Unique identifier for this specific event"
        tests:
          - unique
          - not_null

      - name: event_type
        description: "Type of lifecycle event"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['scheduled', 'boarding', 'departed', 'landed', 'arrived']

      - name: flight_date
        description: "The date of the flight event"
        tests:
          - not_null

  - name: stg_opensky_states
    description: "Deduplicated aircraft state vectors from OpenSky Network, filtered to a continental US bounding box. Preserves full position history — the same aircraft (icao24) legitimately appears multiple times across different snapshot_timestamp values, representing its trajectory over time."
    columns:
      - name: icao24
        description: "Unique ICAO 24-bit transponder address, identifies the aircraft"
        tests:
          - not_null

      - name: snapshot_timestamp
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - icao24
              - snapshot_timestamp