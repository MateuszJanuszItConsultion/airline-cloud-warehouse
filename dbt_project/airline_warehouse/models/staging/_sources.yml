version: 2

sources:
  - name: bronze
    catalog: airline_cloud_warehouse
    schema: bronze
    config:
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 50, period: hour}
    tables:
      - name: flights_raw
      - name: weather_raw
      - name: aircraft_utilization_raw
      - name: currency_rates_raw
      - name: flight_events_raw
      
      # Thresholds are tied to Databricks job schedules: consumer and OpenSky
      # run every 8h, so warn = one missed run, error = two missed runs.
      # Changing a schedule requires revisiting these values.
      - name: aircraft_telemetry_raw
        config:
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
      - name: opensky_states_raw
        config:
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}