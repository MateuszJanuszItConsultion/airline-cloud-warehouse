repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (ingestion + airflow/dags)
        entry: ruff check --fix
        language: system
        files: ^(ingestion|airflow/dags)/.*\.py$

      - id: sqlfluff-lint
        name: sqlfluff lint (dbt models)
        entry: python scripts/run_sqlfluff.py
        language: system
        files: ^dbt_project/airline_warehouse/models/.*\.sql$
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, chore, docs, test]