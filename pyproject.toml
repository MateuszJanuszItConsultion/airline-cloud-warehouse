[project]
name = "airline-cloud-warehouse"
version = "0.1.0"
description = "Portfolio cloud data lakehouse: Databricks, dbt, Airflow, Kafka"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest==8.4.2",
    "ruff==0.16.3",
    "sqlfluff==4.3.0",
    "sqlfluff-templater-dbt==4.3.0",
]
ingestion = [
    "confluent-kafka==2.15.1",
    "great-expectations==1.11.3",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "pyarrow==21.0.0",
    "requests==2.32.3",
]
dbt = [
    "dbt-core==1.12.0",
    "dbt-databricks==1.12.3",
]

[tool.uv]
package = false
default-groups = ["dev", "ingestion", "dbt"]

[tool.ruff]
line-length = 120
target-version = "py313"
builtins = ["spark", "dbutils", "display"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]