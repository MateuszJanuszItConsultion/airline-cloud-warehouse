name: Airflow DAG Validation

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate-dags:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/airflow
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_VAR_DATABRICKS_WAREHOUSE_ID: "dummy_warehouse_id"
      AIRFLOW_VAR_DATABRICKS_CATALOG: "dummy_catalog"
      AIRFLOW_VAR_DBT_GIT_URL: "https://github.com/dummy/repo"
      AIRFLOW_VAR_DBT_GIT_BRANCH: "master"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check for relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            airflow_changes:
              - 'airflow/**'
              - 'ingestion/**'
              - 'streaming/**'
              - 'databricks/notebooks/**'
              - 'pyproject.toml'
              - 'uv.lock'

      - name: Set up uv
        if: steps.filter.outputs.airflow_changes == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      
      - name: Lint Python
        if: steps.filter.outputs.airflow_changes == 'true'
        run: uv run --locked --only-group dev ruff check ingestion/ airflow/dags/ streaming/ databricks/notebooks/

      - name: Install Airflow test environment
        if: steps.filter.outputs.airflow_changes == 'true'
        run: |
          uv venv .venv-airflow --python 3.14
          uv pip install --python .venv-airflow apache-airflow==3.3.0 -r airflow/requirements.txt

      - name: Run DAG tests
        if: steps.filter.outputs.airflow_changes == 'true'
        run: .venv-airflow/bin/python -m pytest airflow/tests/ -v