name: Airflow DAG Validation

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate-dags:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/airflow
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_VAR_DATABRICKS_WAREHOUSE_ID: "dummy_warehouse_id"
      AIRFLOW_VAR_DATABRICKS_CATALOG: "dummy_catalog"
      AIRFLOW_VAR_DBT_GIT_URL: "https://github.com/dummy/repo"
      AIRFLOW_VAR_DBT_GIT_BRANCH: "master"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check for airflow changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            airflow_changes:
              - 'airflow/**'
              - 'ingestion/**'

      - name: Set up Python
        if: steps.filter.outputs.airflow_changes == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        if: steps.filter.outputs.airflow_changes == 'true'      
        run: |
          pip install apache-airflow==3.3.0  
          pip install -r airflow/requirements.txt       
      
      - name: Install ruff
        if: steps.filter.outputs.airflow_changes == 'true'      
        run: pip install ruff

      - name: Lint Python
        if: steps.filter.outputs.airflow_changes == 'true'      
        run: ruff check ingestion/ airflow/dags/

      - name: Run DAG tests
        if: steps.filter.outputs.airflow_changes == 'true'      
        run: pytest airflow/tests/ -v