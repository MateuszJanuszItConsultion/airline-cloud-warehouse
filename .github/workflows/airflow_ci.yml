name: Airflow DAG Validation

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # NOTE: intentionally no path filter (`if:` / `paths:`) here.
  # github.event.pull_request.changed_files is a count (int), not a file list —
  # any `contains(..., 'path')` check against it always evaluates to false,
  # silently skipping this job forever. This workflow is cheap enough to always run.
  validate-dags:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/airflow
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_VAR_DATABRICKS_WAREHOUSE_ID: "dummy_warehouse_id"
      AIRFLOW_VAR_DATABRICKS_CATALOG: "dummy_catalog"
      AIRFLOW_VAR_DBT_GIT_URL: "https://github.com/dummy/repo"
      AIRFLOW_VAR_DBT_GIT_BRANCH: "master"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install apache-airflow==3.3.0  
          pip install -r airflow/requirements.txt       
      
      - name: Run DAG tests
        run: pytest airflow/tests/ -v