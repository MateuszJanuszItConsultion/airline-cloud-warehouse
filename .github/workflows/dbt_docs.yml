name: dbt Docs

on:
  push:
    branches: [master]
    paths:
      - 'dbt_project/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt_project/airline_warehouse

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group dbt

      - name: Set up dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          airline_warehouse:
            target: dev
            outputs:
              dev:
                type: databricks
                catalog: airline_cloud_warehouse
                schema: silver
                host: "{{ env_var('DATABRICKS_HOST') }}"
                http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
                token: "{{ env_var('DATABRICKS_TOKEN') }}"
                threads: 4
          EOF

      - name: dbt deps
        run: uv run --no-sync dbt deps

      - name: dbt docs generate
        run: uv run --no-sync dbt docs generate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dbt_project/airline_warehouse/target

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5