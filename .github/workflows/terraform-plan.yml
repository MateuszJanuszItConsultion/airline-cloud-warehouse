name: terraform-plan

on:
  pull_request:
    paths:
      - "infra/terraform/envs/**"
      - "infra/terraform/modules/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write        # required to request the OIDC token
  pull-requests: write   # required to comment the plan on the PR

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [envs/prod, envs/dev]

    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.root }}

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PLAN }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_admin_username: ${{ secrets.TF_VAR_ADMIN_USERNAME }}
      TF_VAR_ssh_allowed_source_ip: ${{ secrets.TF_VAR_SSH_ALLOWED_SOURCE_IP }}
      TF_VAR_budget_contact_email: ${{ secrets.TF_VAR_BUDGET_CONTACT_EMAIL }}

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive ../..

      - name: init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: validate
        run: terraform validate -no-color

      - name: plan
        id: plan
        run: |
          terraform plan -input=false -no-color -lock=false -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: comment plan on PR
        uses: actions/github-script@v7
        env:
          ROOT: ${{ matrix.root }}
        with:
          script: |
            const fs = require('fs');
            const path = `infra/terraform/${process.env.ROOT}/plan.txt`;
            let plan = fs.readFileSync(path, 'utf8');
            const max = 60000;
            if (plan.length > max) plan = plan.slice(0, max) + '\n... (truncated, see job log)';
            const marker = `<!-- terraform-plan:${process.env.ROOT} -->`;
            const body = `${marker}\n### Terraform plan: \`${process.env.ROOT}\`\n\`\`\`\n${plan}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }