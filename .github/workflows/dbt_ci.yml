name: dbt CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt_project/airline_warehouse

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check for dbt changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dbt_changes:
              - 'dbt_project/**'

      - name: Set up Python
        if: steps.filter.outputs.dbt_changes == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dbt-databricks
        if: steps.filter.outputs.dbt_changes == 'true'
        run: pip install dbt-databricks==1.12.3

      - name: Install sqlfluff
        if: steps.filter.outputs.dbt_changes == 'true'
        run: pip install sqlfluff sqlfluff-templater-dbt

      - name: Set up dbt profiles.yml
        if: steps.filter.outputs.dbt_changes == 'true'
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          airline_warehouse:
            target: dev
            outputs:
              dev:
                type: databricks
                catalog: airline_cloud_warehouse
                schema: silver
                host: "{{ env_var('DATABRICKS_HOST') }}"
                http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
                token: "{{ env_var('DATABRICKS_TOKEN') }}"
                threads: 4
          EOF

      - name: dbt deps
        if: steps.filter.outputs.dbt_changes == 'true'      
        run: dbt deps

      - name: Lint SQL
        if: steps.filter.outputs.dbt_changes == 'true'
        run: sqlfluff lint models/

      - name: dbt debug
        if: steps.filter.outputs.dbt_changes == 'true'
        run: dbt debug

      - name: dbt build
        if: steps.filter.outputs.dbt_changes == 'true'
        run: dbt build