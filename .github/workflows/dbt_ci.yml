name: dbt CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt_project/airline_warehouse

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check for dbt changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            dbt_changes:
              - 'dbt_project/**'
              - 'pyproject.toml'
              - 'uv.lock'

      - name: Set up uv
        if: steps.filter.outputs.dbt_changes == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        if: steps.filter.outputs.dbt_changes == 'true'
        run: uv sync --locked --no-default-groups --group dev --group dbt

      - name: Set up dbt profiles.yml
        if: steps.filter.outputs.dbt_changes == 'true'
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          airline_warehouse:
            target: dev
            outputs:
              dev:
                type: databricks
                catalog: airline_cloud_warehouse
                schema: silver
                host: "{{ env_var('DATABRICKS_HOST') }}"
                http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
                token: "{{ env_var('DATABRICKS_TOKEN') }}"
                threads: 4
          EOF

      - name: dbt deps
        if: steps.filter.outputs.dbt_changes == 'true'
        run: uv run --no-sync dbt deps

      - name: Lint SQL
        if: steps.filter.outputs.dbt_changes == 'true'
        run: uv run --no-sync sqlfluff lint models/

      - name: dbt debug
        if: steps.filter.outputs.dbt_changes == 'true'
        run: uv run --no-sync dbt debug

      - name: dbt build
        if: steps.filter.outputs.dbt_changes == 'true'
        run: uv run --no-sync dbt build