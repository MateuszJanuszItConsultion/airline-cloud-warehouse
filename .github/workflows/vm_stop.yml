name: Stop Azure VM

on:
  schedule:
    - cron: '50 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stop-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Stop VM (deallocate)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az vm deallocate --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AZURE_VM_NAME }}