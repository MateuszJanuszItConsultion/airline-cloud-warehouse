name: Start Azure VM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start VM
        uses: azure/CLI@v3
        with:
          inlineScript: |
            az vm start --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AZURE_VM_NAME }}