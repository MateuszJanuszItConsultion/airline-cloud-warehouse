resources:
  jobs:
    autoloader_flight_events:
      name: autoloader_flight_events
      tasks:
        - task_key: autoloader_flight_events
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/autoloader_flight_events.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
