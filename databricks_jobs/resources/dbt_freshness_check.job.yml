resources:
  jobs:
    dbt_freshness_check:
      name: DBT_freshness_check
      tasks:
        - task_key: DBT_check_freshness
          dbt_task:
            catalog: airline_cloud_warehouse
            commands:
              - dbt deps
              - dbt source freshness --select source:bronze.aircraft_telemetry_raw source:bronze.opensky_states_raw
            project_directory: dbt_project/airline_warehouse
            source: GIT
            warehouse_id: ${var.warehouse_id}
          disabled: false
          email_notifications: {}
          environment_key: dbt-default
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
      email_notifications:
        no_alert_for_skipped_runs: false
        on_failure:
          - ${workspace.current_user.userName}
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
        - environment_key: dbt-default
          spec:
            dependencies:
              - dbt-databricks>=1.0.0,<2.0.0
            environment_version: "6"
      git_source:
        git_branch: master
        git_provider: gitHub
        git_url: https://github.com/MateuszJanuszItConsultion/airline-cloud-warehouse
      max_concurrent_runs: 1
      notification_settings:
        no_alert_for_canceled_runs: false
        no_alert_for_skipped_runs: false
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 6
          unit: HOURS
      webhook_notifications: {}
